name: Promote development to test

# Manual promotion: opens a development → test PR when development is ahead.
# Opens the PR, never merges it. Merging into test deploys the preview
# ("Deploy preview (test)" runs after CI passes on test). The next step is
# "Promote test to production".

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-development-to-test
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open development → test promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin development test
          OPEN_PR=$(gh pr list --base test --head development --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN_PR" ]; then
            echo "Promotion PR #$OPEN_PR is already open; nothing to do."
            exit 0
          fi
          AHEAD=$(git rev-list --count origin/test..origin/development)
          if [ "$AHEAD" -eq 0 ]; then
            echo "development has no new commits vs test; nothing to promote."
            exit 0
          fi
          COMMITS=$(git log --oneline origin/test..origin/development | head -10)
          {
            echo "Promotes development to test. After merge, CI runs on test and Deploy preview (test) deploys https://dimitris-pens-test.vercel.app."
            echo
            echo "Commits included:"
            echo '```'
            echo "$COMMITS"
            echo '```'
          } > pr-body.md
          gh pr create --base test --head development \
            --title "promote: development → test ($(date -u +%Y-%m-%d))" \
            --body-file pr-body.md
