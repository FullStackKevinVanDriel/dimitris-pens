name: Promote test to production

# Manual promotion: opens a test → main PR when test is ahead.
# Mirrors the UpsideOnly promotion-routine pattern — opens the PR,
# never auto-merges. Merging main auto-deploys to Vercel (production).

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-test-to-prod
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open test → main promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin test main
          if gh pr list --base main --head test --state open --jq -e '.[0]' >/dev/null; then
            echo "A test → main promotion PR is already open; nothing to do."
            exit 0
          fi
          AHEAD=$(git rev-list --count main..origin/test)
          if [ "$AHEAD" -eq 0 ]; then
            echo "test has no new commits vs main; nothing to promote."
            exit 0
          fi
          COMMITS=$(git log --oneline main..origin/test | head -10)
          gh pr create --base main --head test \
            --title "promote: test → production ($(date -u +%Y-%m-%d))" \
            --body "Promotes test to production (main). Merging auto-deploys to Vercel.

Commits included:
\`\`\`
$COMMITS
\`\`\`

Closes #9."
