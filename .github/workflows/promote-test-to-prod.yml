name: Promote test to production

# Manual promotion: opens a test → main PR when test is ahead. Opens the PR,
# never merges it. Merging into main deploys production ("Deploy production"
# runs after CI passes on main). The step before this is "Promote development
# to test".

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-test-to-prod
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open test → main promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin test main
          OPEN_PR=$(gh pr list --base main --head test --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN_PR" ]; then
            echo "Promotion PR #$OPEN_PR is already open; nothing to do."
            exit 0
          fi
          AHEAD=$(git rev-list --count origin/main..origin/test)
          if [ "$AHEAD" -eq 0 ]; then
            echo "test has no new commits vs main; nothing to promote."
            exit 0
          fi
          COMMITS=$(git log --oneline origin/main..origin/test | head -10)
          {
            echo "Promotes test to production (main). After merge, CI runs on main and Deploy production deploys it."
            echo
            echo "Commits included:"
            echo '```'
            echo "$COMMITS"
            echo '```'
          } > pr-body.md
          gh pr create --base main --head test \
            --title "promote: test → production ($(date -u +%Y-%m-%d))" \
            --body-file pr-body.md
