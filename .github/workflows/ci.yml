name: CI

# Runs migrations + the full smoke test (API + headless Chromium) against a
# throwaway Postgres on every PR into test and on every push to test.
#
# Not on PRs into main: those are promotion PRs (test → main) whose head is
# a test commit the push run already checked — its "smoke" check shows on
# the promotion PR and satisfies main's required check. The promote
# workflow opens them with GITHUB_TOKEN, and a pull_request run for such a
# PR started with zero jobs and showed as failed (#27).
# Any other PR into main gets no smoke check and stays blocked; run this
# workflow manually on its branch if that's ever really needed.
#
# Also on push to main: a passing run there is what triggers "Deploy
# production" (and on test, "Deploy preview (test)").

on:
  pull_request:
    branches: [test]
  push:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: penstest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgres://postgres:penstest@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            smoke/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix smoke
          (cd smoke && npx playwright install --with-deps chromium)

      - name: Smoke test (migrations, API, browser)
        run: npm run smoke
