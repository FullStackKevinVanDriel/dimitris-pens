name: CI

# Runs migrations + the full smoke test (API + headless Chromium) against a
# throwaway Postgres on every PR into development and on every push to
# development, test and main.
#
# Not on PRs into test or main: those are promotion PRs (development -> test,
# test -> main) opened by the promote workflows with GITHUB_TOKEN. GitHub
# doesn't start pull_request runs for them (one once showed as a zero-job
# failure, #27), but their head is a commit the push run already checked,
# so its "smoke" check shows on the promotion PR and satisfies the required
# check. Any other PR into test or main gets no smoke check and stays blocked.
#
# A passing push run on test triggers "Deploy preview (test)"; on main,
# "Deploy production". development isn't deployed; it's what localhost runs.

on:
  pull_request:
    branches: [development]
  push:
    branches: [development, test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only on PRs into development: feature/ or fix/ branch, closes an open issue (#49).
  pr-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Branch name and linked issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: bash scripts/pr-rules.sh

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: penstest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgres://postgres:penstest@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            smoke/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix smoke
          (cd smoke && npx playwright install --with-deps chromium)

      - name: Smoke test (migrations, API, browser)
        run: npm run smoke
